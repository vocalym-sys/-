<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DGNSS 기준국 지도</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">
  <header id="header">
    <h1>대한민국 GNSS 보정 서비스 지도</h1>
    <p class="subtitle">DGNSS 기준국 및 센티미터급 서비스(PPP-RTK) 구역</p>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <div class="category-group" id="categoryToggles">
        <label class="category-toggle">
          <input type="checkbox" id="toggleDgnss" checked />
          <span>DGNSS 서비스 범위</span>
        </label>
        <label class="category-toggle">
          <input type="checkbox" id="togglePppRtk" checked />
          <span>센티미터급 서비스(PPP-RTK) 범위</span>
        </label>
      </div>

      <div id="dgnssPanel">
        <div class="filter-group" id="typeFilters"></div>
        <div class="station-count" id="stationCount"></div>
        <label class="select-all-row" id="selectAllRow">
          <input type="checkbox" id="selectAllStations" checked />
          <span>전체 선택 / 해제</span>
        </label>
        <ul id="stationList"></ul>
      </div>

      <div class="source-note">
        DGNSS 출처: <a href="https://www.nmpnt.go.kr/home/sub.do?menukey=4810" target="_blank" rel="noopener">국립해양측위정보원 &gt; 사업소개 &gt; 위성항법보정시스템 &gt; 중파기반서비스 &gt; 좌표현황</a><br>
        DGNSS 커버리지 반경: 해양 100해리(185.2km), 내륙 80km (점선원, 확인용 추정치)<br>
        PPP-RTK 구역: 영해(12해리) 기준 참고 이미지를 바탕으로 한 근사 경계(실측 좌표 아님)
      </div>
    </aside>

    <main id="map"></main>
  </div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/stations.js"></script>
<script src="js/ppp-rtk.js"></script>
<script src="js/app.js"></script>
</body>
</html>
