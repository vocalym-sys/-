<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DGNSS 기준국 지도</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div id="app">
  <header id="header">
    <h1>대한민국 DGNSS 기준국 지도</h1>
    <p class="subtitle">국립해양측위정보원(NMPNT) 중파(MF) 기반 DGNSS 서비스 송신국 좌표 기준</p>
  </header>

  <div id="layout">
    <aside id="sidebar">
      <div class="filter-group" id="typeFilters"></div>
      <div class="station-count" id="stationCount"></div>
      <label class="select-all-row" id="selectAllRow">
        <input type="checkbox" id="selectAllStations" checked />
        <span>전체 선택 / 해제</span>
      </label>
      <ul id="stationList"></ul>
      <div class="source-note">
        출처: <a href="https://www.nmpnt.go.kr/home/sub.do?menukey=4810" target="_blank" rel="noopener">국립해양측위정보원 &gt; 사업소개 &gt; 위성항법보정시스템 &gt; 중파기반서비스 &gt; 좌표현황</a><br>
        커버리지 반경: 해양 100해리(185.2km), 내륙 80km (점선원, 확인용 추정치)
      </div>
    </aside>

    <main id="map"></main>
  </div>
</div>

<script src="vendor/leaflet/leaflet.js"></script>
<script src="js/stations.js"></script>
<script src="js/app.js"></script>
</body>
</html>
